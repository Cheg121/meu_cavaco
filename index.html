<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Cavaco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D5C45">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#EEF2EA;--card:#FBFCF8;--ink:#17261F;--mut:#5D6E64;--acc:#1D5C45;--onacc:#fff;--chord:#A85B00;--line:#D3DCD0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A16;--card:#1B2620;--ink:#E6EEE7;--mut:#93A59A;--acc:#5FC79C;--onacc:#0B1510;--chord:#F0B24A;--line:#2B3A31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121A16;--card:#1B2620;--ink:#E6EEE7;--mut:#93A59A;--acc:#5FC79C;--onacc:#0B1510;--chord:#F0B24A;--line:#2B3A31;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:30px;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.search{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px}
.search:focus,input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.letter{font-weight:800;color:var(--acc);font-size:15px;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--line)}
.item{display:block;padding:12px 4px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.item b{display:block;font-size:18px;font-weight:600}
.item span,.mut{color:var(--mut);font-size:14px}
.empty{color:var(--mut);padding:32px 4px;text-align:center}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);border:0;border-radius:30px;padding:16px 22px;font:600 17px "Bricolage Grotesque",sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:12px 18px;font:600 16px "Bricolage Grotesque",sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.d{background:transparent;color:#C0392B;border:1.5px solid #C0392B}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.back{color:var(--acc);text-decoration:none;font-weight:600}
.cifra{font:500 14.5px/1.35 "DM Mono",ui-monospace,monospace;white-space:pre;overflow-x:auto;background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
.cifra .cl{color:var(--chord);font-weight:500}
.cifra .c{cursor:pointer;border-bottom:1.5px dotted var(--chord)}
.cifra .c.k{background:color-mix(in srgb,var(--chord) 18%,transparent);border-radius:4px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea.cf{font:500 14px/1.35 "DM Mono",ui-monospace,monospace;white-space:pre;min-height:300px}
.yt{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;color:inherit;text-decoration:none;background:var(--card);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
.sh svg{width:170px;height:auto;display:block;margin:8px auto}
.sh svg *{stroke:var(--ink)}
.sh svg .dot{fill:var(--ink);stroke:none}
.sh svg text{fill:var(--ink);stroke:none;font:600 14px "Bricolage Grotesque",sans-serif}
.sh input{text-align:center;font-size:18px;font-family:"DM Mono",monospace}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var S={songs:[],chords:{}},q="";
var $=function(s){return document.querySelector(s)};
var app=$("#app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function uid(){return Math.random().toString(36).slice(2,8)}

/* ---------- armazenamento ---------- */
function loadLocal(){try{var j=localStorage.getItem("cavaco");if(j)S=JSON.parse(j)}catch(e){}}
function save(){
  try{localStorage.setItem("cavaco",JSON.stringify(S))}catch(e){}
  try{if(window.cavaco.onSave)window.cavaco.onSave(S)}catch(e){}
}
window.cavaco={onSave:null,paint:null,
  state:function(){return S},
  commit:function(){
    try{localStorage.setItem("cavaco",JSON.stringify(S))}catch(e){}
    var h=location.hash;
    if(h===""||h==="#"){if($("#res"))res()}
    else if(/^#s-/.test(h)){var y=window.scrollY;route();window.scrollTo(0,y)}
  }};

/* ---------- cifras ---------- */
var CH=/^[A-G][#b]?(maj|min|dim|aug|sus|add|m|M)?\d*(\([^)]*\))?(\/[A-G][#b]?)?$/;
function isChordLine(l){var t=l.trim().split(/\s+/);return l.trim()!==""&&t.every(function(x){return CH.test(x)})}
function renderCifra(txt){
  return txt.split("\n").map(function(l){
    if(isChordLine(l)){
      return '<span class="cl">'+l.replace(/\S+/g,function(m){return '<span class="c'+(S.chords[m]?" k":"")+'" data-c="'+esc(m)+'">'+esc(m)+'</span>'})+'</span>';
    }
    return esc(l);
  }).join("\n");
}
function parseFrets(s){
  var t=s.trim().split(/[\s,\-]+/);
  if(t.length!==4)return null;
  var r=[];
  for(var i=0;i<4;i++){
    if(/^x$/i.test(t[i]))r.push(-1);
    else if(/^\d{1,2}$/.test(t[i]))r.push(+t[i]);
    else return null;
  }
  return r;
}
function diagram(f){
  var pos=f.filter(function(x){return x>0}),mx=Math.max.apply(null,pos.concat([0])),mn=Math.min.apply(null,pos.concat([99]));
  var base=mx>5?mn:1,X=[30,63,96,129],g="";
  for(var i=0;i<4;i++)g+='<line x1="'+X[i]+'" y1="40" x2="'+X[i]+'" y2="190" stroke-width="2"/>';
  for(var r=0;r<=5;r++)g+='<line x1="30" y1="'+(40+r*30)+'" x2="129" y2="'+(40+r*30)+'" stroke-width="'+(r===0&&base===1?5:1.2)+'"/>';
  f.forEach(function(v,i){
    if(v===-1)g+='<text x="'+X[i]+'" y="30" text-anchor="middle">×</text>';
    else if(v===0)g+='<circle cx="'+X[i]+'" cy="24" r="6" fill="none" stroke-width="2"/>';
    else g+='<circle class="dot" cx="'+X[i]+'" cy="'+(40+(v-base+.5)*30)+'" r="11"/>';
  });
  if(base>1)g+='<text x="14" y="62" text-anchor="middle">'+base+'ª</text>';
  return '<svg viewBox="0 0 160 200">'+g+'</svg>';
}
function chordSheet(name){
  var cur=S.chords[name]||"";
  var ov=document.createElement("div");ov.className="ov";
  ov.innerHTML='<div class="sh"><h2>'+esc(name)+'</h2><div id="dg">'+(cur&&parseFrets(cur)?diagram(parseFrets(cur)):'<p class="mut">Ainda sem desenho para esta cifra.</p>')+'</div>'
   +'<p class="mut" style="margin:4px 0">Casas das 4 cordas (ré, sol, si, ré), x = não toca</p>'
   +'<input id="fr" inputmode="text" placeholder="ex.: 2 0 2 0" value="'+esc(cur)+'">'
   +'<p id="er" class="mut" style="color:#C0392B;min-height:20px;margin:6px 0"></p>'
   +'<div class="row" style="justify-content:center;margin:0"><button class="btn" id="sv">Salvar desenho</button><button class="btn o" id="cl">Fechar</button></div></div>';
  document.body.appendChild(ov);
  function close(){ov.remove()}
  ov.addEventListener("click",function(e){if(e.target===ov)close()});
  ov.querySelector("#cl").onclick=close;
  ov.querySelector("#sv").onclick=function(){
    var v=ov.querySelector("#fr").value,f=parseFrets(v);
    if(!v.trim()){delete S.chords[name];save();close();route();return}
    if(!f){ov.querySelector("#er").textContent="Use 4 valores, como 2 0 2 0 (ou x para corda muda).";return}
    S.chords[name]=f.map(function(n){return n<0?"x":n}).join(" ");save();close();route();
  };
}

/* ---------- telas ---------- */
function viewList(){
  app.innerHTML='<h1>Meu Cavaco</h1><div id="cl" style="margin:-6px 0 12px"></div><input class="search" id="q" type="search" placeholder="Buscar música, cantor ou grupo" value="'+esc(q)+'"><div id="res"></div><div class="row" style="margin-top:28px"><button class="btn o" id="bk">Baixar backup</button><button class="btn o" id="rs">Restaurar backup</button></div><p id="bm" class="mut"></p><input type="file" id="fi" accept=".json,application/json" hidden><a class="fab" href="#new">+ Nova música</a>';
  var qi=$("#q");qi.addEventListener("input",function(){q=qi.value;res()});
  res();
  if(window.cavaco.paint)window.cavaco.paint();
  var bm=$("#bm");
  $("#bk").onclick=function(){
    var u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})),a=document.createElement("a");
    a.href=u;a.download="meu-cavaco-backup.json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);bm.textContent="Backup baixado. Guarde o arquivo em um lugar seguro.";
  };
  $("#rs").onclick=function(){$("#fi").click()};
  $("#fi").onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);if(!d||!Array.isArray(d.songs))throw 0;
        var ids={};S.songs.forEach(function(s){ids[s.id]=1});var n=0;
        d.songs.forEach(function(s){if(s&&s.id&&s.title&&!ids[s.id]){S.songs.push(s);n++}});
        Object.keys(d.chords||{}).forEach(function(k){if(!S.chords[k])S.chords[k]=d.chords[k]});
        save();res();bm.textContent="Backup restaurado: "+n+" música(s) adicionada(s).";
      }catch(x){bm.textContent="Esse arquivo não parece ser um backup do Meu Cavaco."}
    };
    r.readAsText(f);e.target.value="";
  };
}
function res(){
  var n=norm(q.trim()),L=S.songs.filter(function(s){return !n||norm(s.title).indexOf(n)>-1||norm(s.artist||"").indexOf(n)>-1});
  L.sort(function(a,b){return norm(a.title).localeCompare(norm(b.title))});
  var h="",last="";
  L.forEach(function(s){
    var l=norm(s.title).charAt(0).toUpperCase();if(!/[A-Z]/.test(l))l="#";
    if(l!==last){h+='<div class="letter">'+l+'</div>';last=l}
    h+='<a class="item" href="#s-'+s.id+'"><b>'+esc(s.title)+'</b><span>'+esc(s.artist||"Sem artista")+'</span></a>';
  });
  if(!h)h='<div class="empty">'+(S.songs.length?"Nada encontrado para essa busca.":"Sua lista está vazia. Toque em Nova música para começar.")+'</div>';
  $("#res").innerHTML=h;
}
function find(id){return S.songs.filter(function(s){return s.id===id})[0]}
function viewSong(s){
  var vids=(s.links||[]).map(function(u,i){return '<a class="yt" href="'+esc(u)+'" target="_blank" rel="noopener">▶ Vídeo '+(i+1)+' <span class="mut">'+esc(u.replace(/^https?:\/\/(www\.)?/,""))+'</span></a>'}).join("");
  app.innerHTML='<a class="back" href="#">‹ Todas as músicas</a><h1 style="margin-bottom:2px">'+esc(s.title)+'</h1><div class="mut">'+esc(s.artist||"")+'</div>'
   +'<div class="mut" style="margin-top:10px">Toque em uma cifra para ver o desenho no cavaquinho.</div>'
   +'<div class="cifra" id="cf">'+renderCifra(s.text||"")+'</div>'
   +(vids?'<h2 style="font-size:18px;margin-top:20px">Vídeos</h2>'+vids:'')
   +'<div class="row"><a class="btn o" href="#e-'+s.id+'">Editar</a></div>';
  $("#cf").addEventListener("click",function(e){var c=e.target.closest(".c");if(c)chordSheet(c.dataset.c)});
}
function viewEdit(s){
  var isNew=!s;s=s||{id:uid(),title:"",artist:"",text:"",links:[]};
  app.innerHTML='<a class="back" href="'+(isNew?'#':'#s-'+s.id)+'">‹ Voltar</a><h1>'+(isNew?"Nova música":"Editar música")+'</h1>'
   +'<label for="t">Música</label><input id="t" value="'+esc(s.title)+'">'
   +'<label for="a">Cantor ou grupo</label><input id="a" value="'+esc(s.artist||"")+'">'
   +'<label for="x">Letra com cifras</label><div class="mut" style="margin-bottom:6px">Escreva a linha das cifras acima da linha da letra, como no Cifra Club.</div>'
   +'<div class="row" style="margin:6px 0"><button class="btn o" id="bl">Buscar letra</button><a class="btn o" id="lc" target="_blank" rel="noopener">Cifra Club</a><a class="btn o" id="ll" target="_blank" rel="noopener">Letras.mus.br</a><a class="btn o" id="lv" target="_blank" rel="noopener">Vagalume</a></div><p id="lm" class="mut" style="margin:0 0 6px"></p>'
   +'<textarea class="cf" id="x" spellcheck="false" placeholder="G        D\nLetra da música aqui">'+esc(s.text||"")+'</textarea>'
   +'<label for="l">Links do YouTube (um por linha)</label><textarea id="l" rows="3" placeholder="https://youtu.be/...">'+esc((s.links||[]).join("\n"))+'</textarea>'
   +'<p id="er" style="color:#C0392B;min-height:20px"></p>'
   +'<div class="row"><button class="btn" id="sv">Salvar</button>'+(isNew?'':'<button class="btn d" id="dl">Excluir</button>')+'</div>';
  $("#sv").onclick=function(){
    var t=$("#t").value.trim();
    if(!t){$("#er").textContent="Digite o nome da música.";return}
    s.title=t;s.artist=$("#a").value.trim();s.text=$("#x").value.replace(/\s+$/,"");
    s.links=$("#l").value.split("\n").map(function(u){return u.trim()}).filter(function(u){return /^https?:\/\//.test(u)});
    if(isNew)S.songs.push(s);
    save();location.hash="s-"+s.id;
  };
  function clean(t){return t.replace(/\s*[\(\[][^\)\]]*[\)\]]\s*/g," ").replace(/\s+(feat|ft|part)\.?\s.*$/i,"").replace(/\s+/g," ").trim()}
  function links(){
    var k=encodeURIComponent((clean($("#t").value)+" "+$("#a").value).trim());
    $("#lc").href="https://www.cifraclub.com.br/?q="+k;
    $("#ll").href="https://www.letras.mus.br/?q="+k;$("#lv").href="https://www.vagalume.com.br/search?q="+k;
  }
  $("#t").addEventListener("input",links);$("#a").addEventListener("input",links);links();
  function getLyrics(ar,t){
    var c=new AbortController(),tm=setTimeout(function(){c.abort()},15000);
    return fetch("https://api.lyrics.ovh/v1/"+encodeURIComponent(ar)+"/"+encodeURIComponent(t),{signal:c.signal})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){
        var l=(j&&j.lyrics||"").replace(/\r\n?/g,"\n").replace(/^Paroles de la chanson[^\n]*\n+/i,"").replace(/\n{3,}/g,"\n\n").trim();
        if(!l)throw 0;return l;
      }).then(function(l){clearTimeout(tm);return l},function(e){clearTimeout(tm);throw e});
  }
  $("#bl").onclick=function(){
    var t=$("#t").value.trim(),ar=$("#a").value.trim(),m=$("#lm"),x=$("#x");
    if(!t||!ar){m.textContent="Preencha a música e o cantor ou grupo para buscar a letra.";return}
    if(x.value.trim()){m.textContent="Já existe texto na letra. Apague-o antes de buscar.";return}
    m.textContent="Buscando letra...";
    var t2=clean(t);
    getLyrics(ar,t).catch(function(){if(t2&&t2!==t)return getLyrics(ar,t2);throw 0})
      .then(function(l){x.value=l;m.textContent="Letra encontrada. Agora coloque as cifras nas linhas acima de cada trecho."})
      .catch(function(){m.textContent="Não achei essa letra. Use o Cifra Club (já tem as cifras) ou Letras/Vagalume para copiar e colar aqui."});
  };
  var d=$("#dl");
  if(d)d.onclick=function(){
    if(!d.dataset.ok){d.dataset.ok=1;d.textContent="Toque de novo para excluir";return}
    S.songs=S.songs.filter(function(x){return x.id!==s.id});save();location.hash="";
  };
}
function route(){
  var h=location.hash.slice(1);window.scrollTo(0,0);
  if(h==="new")return viewEdit(null);
  var m=/^(s|e)-(\w+)$/.exec(h),s=m&&find(m[2]);
  if(!s)return viewList();
  m[1]==="s"?viewSong(s):viewEdit(s);
}
window.addEventListener("hashchange",route);
loadLocal();route();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
<script type="module" src="cloud.js"></script>
</body>
</html>

<script>
(function(){

var $=function(s){return document.querySelector(s)};

  $("#cg").innerHTML=N.length?'<div class="grid">'+N.map(function(k){var V=vars(k);return '<div class="cc" data-n="'+esc(k)+'"><b>'+esc(k)+'</b>'+(V.length?dg(V[0],64):'<p class="mut">sem desenho</p>')+'<span class="mut">'+V.length+(V.length===1?' variação':' variações')+'</span></div>'}).join("")+'</div>':'<div class="empty">'+(Object.keys(S.chords).length?"Nenhum acorde encontrado.":"O dicionário está vazio. Adicione um acorde acima.")+'</div>';

  state:function(){return S},

    var h=location.hash;

var CH=/^[A-G][#b]?(maj|min|dim|aug|sus|add|m|M|º|°|\+)?[0-9]*(M|maj|m|sus[24]?|add[0-9]+|dim|aug|º|°|[#b+-][0-9]+|\([^)]*\))*(\/([A-G][#b]?|[0-9]+))?$/;

function isChordLine(l){if(!l.trim())return false;var t=l.trim().split(/\s+/),c=0;for(var i=0;i<t.length;i++){var k=tk(t[i]);if(!k)return false;if(k!=="l")c++}return c>0}

    return esc(l);

function parseFrets(s){
  var t=String(s).trim().split(/[\s,\-]+/);if(t.length<4||t.length>6)return null;
  var r=[],i,m;for(i=0;i<4;i++){if(/^x$/i.test(t[i]))r.push(-1);else if(/^\d{1,2}$/.test(t[i]))r.push(+t[i]);else return null}

function diagram(f,nums){
  var pos=f.filter(function(x){return x>0}),mx=Math.max.apply(null,pos.concat([0])),mn=Math.min.apply(null,pos.concat([99]));
  var base=mx>5?mn:1,X=[30,63,96,129],g="",cy=function(v){return 40+(v-base+.5)*30};
  for(var i=0;i<4;i++)g+='<line x1="'+X[i]+'" y1="40" x2="'+X[i]+'" y2="190" stroke-width="2"/>';
  for(var r=0;r<=5;r++)g+='<line x1="30" y1="'+(40+r*30)+'" x2="129" y2="'+(40+r*30)+'" stroke-width="'+(r===0&&base===1?5:1.2)+'"/>';
  var bs=f.bar?[0,1,2,3].filter(function(i){return f[i]===f.bar}):[],bl=0;[0,1,2,3].forEach(function(i){if(f.bar&&f[i]>=f.bar)bl=i});
  if(bs.length>1){g+='<rect class="dot" x="'+(X[bs[0]]-11)+'" y="'+(cy(f.bar)-11)+'" width="'+(X[bl]-X[bs[0]]+22)+'" height="22" rx="11"/>';if(nums)g+='<text class="fn" x="'+X[bs[0]]+'" y="'+(cy(f.bar)+5)+'" text-anchor="middle">1</text>'}
  f.forEach(function(v,i){
    if(v===-1)g+='<text x="'+X[i]+'" y="30" text-anchor="middle">×</text>';
    else if(v===0)g+='<circle cx="'+X[i]+'" cy="24" r="6" fill="none" stroke-width="2"/>';
    else if(bs.length>1&&v===f.bar){}
    else{g+='<circle class="dot" cx="'+X[i]+'" cy="'+cy(v)+'" r="11"/>';
      if(nums&&f.fing&&f.fing[i]!=="0")g+='<text class="fn" x="'+X[i]+'" y="'+(cy(v)+5)+'" text-anchor="middle">'+f.fing[i]+'</text>'}
  });
  if(base>1)g+='<text x="14" y="62" text-anchor="middle">'+base+'ª</text>';
  return '<svg viewBox="0 0 160 200">'+g+'</svg>';
}
function dg(str,w){var f=parseFrets(str);return f?diagram(f,(w||90)>=100).replace("<svg ",'<svg class="dg" style="width:'+(w||90)+'px" '):""}
function sheet(){var o=document.createElement("div");o.className="ov";o.innerHTML='<div class="sh"></div>';document.body.appendChild(o);o.addEventListener("click",function(e){if(e.target===o)o.remove()});return o}

/* identificação de acordes a partir do desenho (afinação D G B D) */
var PCN=["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"],OPENM=[62,67,71,74];
var TPL=[["",[0,4,7]],["m",[0,3,7]],["7",[0,4,7,10]],["7M",[0,4,7,11]],["m7",[0,3,7,10]],["m7(b5)",[0,3,6,10]],["dim",[0,3,6]],["dim7",[0,3,6,9]],["aug",[0,4,8]],["sus4",[0,5,7]],["sus2",[0,2,7]],["7sus4",[0,5,7,10]],["6",[0,4,7,9]],["m6",[0,3,7,9]],["add9",[0,2,4,7]],["madd9",[0,2,3,7]],["m7M",[0,3,7,11]],["9",[0,2,4,7,10]],["m9",[0,2,3,7,10]],["7M(9)",[0,2,4,7,11]],["6/9",[0,2,4,7,9]],["7(b9)",[0,1,4,7,10]]];
function identify(f){
  var notes=[];f.forEach(function(v,i){if(v>=0)notes.push(OPENM[i]+v)});
  if(!notes.length)return [];
  var bass=Math.min.apply(null,notes)%12,P={};notes.forEach(function(m){P[m%12]=1});
  var pcs=Object.keys(P).map(Number);if(pcs.length<2)return [];
  var out=[];
  for(var r=0;r<12;r++)TPL.forEach(function(t,ti){
    var T=t[1],rel=pcs.map(function(p){return (p-r+12)%12});
    if(!rel.every(function(x){return T.indexOf(x)>-1}))return;
    if(!T.every(function(x){return rel.indexOf(x)>-1||x===7}))return;
    out.push({n:PCN[r]+t[0],b:bass!==r?PCN[bass]:"",s:(bass!==r?5:0)+ti+(rel.indexOf(7)<0&&T.indexOf(7)>-1?3:0)});

function searchHtml(st,pk){
  var f=st.f,SN="DGBD";
  if(f.every(function(v){return v<0}))return '<p class="mut" style="margin-top:12px">Desenhe o acorde no braço.</p>';

  s.f.forEach(function(v){if(v>0)cnt[v]=(cnt[v]||0)+1});

/* visualizar/escolher a variação de um acorde dentro de uma música (por ocorrência) */
function chordView(n,s,cb,occ){
  var o=sheet(),b=o.firstChild,tot=occ?occCount(s.text||"",n):0,multi=occ&&tot>1,key=multi?n+"#"+occ:n;
  function cur(V){var p=s.pv||{},i=p[key]!=null?p[key]:(p[n]!=null?p[n]:0);return Math.min(i,Math.max(V.length-1,0))}
  function draw(){
    var V=vars(n),i=cur(V),m=V.length>1;s.pv=s.pv||{};
    b.innerHTML='<h2>'+esc(n)+'</h2>'+(multi?'<p class="mut" style="margin:2px 0">Ocorrência '+occ+' de '+tot+' nesta música</p>':'')
     +(V.length?'<div style="display:flex;align-items:center;justify-content:center;gap:6px">'+(m?'<button class="ib" id="pr">‹</button>':'')+dg(V[i],170)+(m?'<button class="ib" id="nx">›</button>':'')+'</div><p class="mut">Variação '+(i+1)+' de '+V.length+(m?(multi?' · vale só para esta ocorrência':' · a escolha fica salva nesta música'):'')+'</p>':'<p class="mut">Este acorde ainda não tem desenho no dicionário.</p>')
     +'<div class="row" style="justify-content:center;margin:8px 0 0">'+(m&&multi?'<button class="btn o" id="al">Usar em todas as ocorrências</button>':'')+'<button class="btn" id="ed">'+(V.length?'Gerenciar variações':'Adicionar desenho')+'</button><button class="btn o" id="cx">Fechar</button></div>';
    b.querySelector("#cx").onclick=function(){o.remove();if(cb)cb()};
    b.querySelector("#ed").onclick=function(){o.remove();chordEditor(n,function(){chordView(n,s,cb,occ)})};
    if(m){
      b.querySelector("#pr").onclick=function(){s.pv[key]=(i-1+V.length)%V.length;save();draw()};
      b.querySelector("#nx").onclick=function(){s.pv[key]=(i+1)%V.length;save();draw()};
      var al=b.querySelector("#al");
      if(al)al.onclick=function(){Object.keys(s.pv).forEach(function(k){if(k.indexOf(n+"#")===0)delete s.pv[k]});s.pv[n]=i;save();draw()};
    }
  }
  draw();
}

   +'<div class="row" style="margin:6px 0"><button class="btn o" id="bl">Buscar letra</button><a class="btn o" id="lc" target="_blank" rel="noopener">Cifra Club</a><a class="btn o" id="ll" target="_blank" rel="noopener">Letras.mus.br</a><a class="btn o" id="lv" target="_blank" rel="noopener">Vagalume</a></div><p id="lm" class="mut" style="margin:0 0 6px"></p>'
   +'<textarea class="cf" id="x" spellcheck="false" placeholder="G        D\nLetra da música aqui">'+esc(s.text||"")+'</textarea>'
   +'<div id="vz" style="display:none"></div>'
   +'<label>Acordes desta música</label><div class="mut">Toque em um acorde para escolher a variação do dicionário.</div><div id="ch"></div>'
   +'<label for="l">Links do YouTube (um por linha)</label><textarea id="l" rows="3" placeholder="https://youtu.be/...">'+esc((s.links||[]).join("\n"))+'</textarea>'
   +'<p id="er" style="color:#C0392B;min-height:20px"></p>'
   +'<div class="row"><button class="btn" id="sv">Salvar</button>'+(isNew?'':'<button class="btn d" id="dl">Excluir</button>')+'</div>';
  function chips(){
    var N=chordNames($("#x").value);
    $("#ch").innerHTML=N.length?N.map(function(c){return '<span class="chip'+(vars(c).length?"":" no")+'" data-c="'+esc(c)+'">'+esc(c)+'</span>'}).join(""):'<div class="mut" style="margin-top:6px">Nenhum acorde reconhecido ainda.</div>';
  }
  $("#ch").addEventListener("click",function(e){var c=e.target.closest(".chip");if(c)chordView(c.dataset.c,s,chips)});
  $("#x").addEventListener("input",chips);chips();
  var M=[],sel=null,extra=[],vz=$("#vz"),ta=$("#x");
  function occOf(mi,t,name){var k=0;for(var i=0;i<M.length;i++){var T=toks(M[i].c);for(var j=0;j<T.length;j++){if(i===mi&&T[j].c===t)return k+1;if(T[j].n===name)k++}}return 0}
  function parseM(){var L=ta.value.split("\n"),o=[];for(var i=0;i<L.length;i++){
    if(isChordLine(L[i])){if(i+1<L.length&&!isChordLine(L[i+1])){o.push({c:L[i],l:L[i+1]});i++}else o.push({c:L[i],l:null})}else o.push({c:"",l:L[i]})}
    return o}
  function toks(c){var a=[];c.replace(/\S+/g,function(t,i){a.push({c:i,n:t});return t});return a}
  function build(a){a.sort(function(x,y){return x.c-y.c});var s="";a.forEach(function(t){var c=Math.max(t.c,s.length?s.length+1:0);s+=" ".repeat(c-s.length)+t.n});return s}
  function ser(){var o=[];M.forEach(function(m){if(m.c.trim()!=="")o.push(m.c.replace(/\s+$/,""));if(m.l!==null)o.push(m.l)});return o.join("\n")}
  function commit(){ta.value=ser();chips();draw()}
  function place(mi,col,name,src){
    if(src)M[src.m].c=build(toks(M[src.m].c).filter(function(x){return x.c!==src.t}));
    var b=toks(M[mi].c);b.push({c:col,n:name});M[mi].c=build(b);commit();
  }
  function rowHtml(m,i){
    var h="",p=0;m.c.replace(/\S+/g,function(t,x){h+=" ".repeat(x-p)+'<span class="pt'+(CH.test(t)?"":" so")+'" data-m="'+i+'" data-t="'+x+'">'+esc(t)+'</span>';p=x+t.length;return t});
    var tx=m.l||"",n=Math.max(tx.length+1,26),y="";
    for(var k=0;k<n;k++)y+='<span class="lc" data-m="'+i+'" data-c="'+k+'">'+(k<tx.length?esc(tx.charAt(k)):" ")+'</span>';
    return '<div class="vc">'+(h||" ")+'</div><div>'+y+'</div>';
  }
  function draw(){
    var N=Object.keys(S.chords);
    chordNames(ta.value).concat(extra).forEach(function(n){if(N.indexOf(n)<0)N.push(n)});
    var pv="";
    if(sel){
      var V=vars(sel),i=Math.min((s.pv||{})[sel]||0,Math.max(V.length-1,0));
      pv='<div class="pv">'+(V.length?'<div>'+dg(V[i],58)+'</div><div style="flex:1;text-align:left"><b style="color:var(--chord);font-size:18px">'+esc(sel)+'</b><div class="mut">Variação '+(i+1)+' de '+V.length+'</div></div>'+(V.length>1?'<button class="ib" data-pv="-1">‹</button><button class="ib" data-pv="1">›</button>':'')+'<button class="btn o" data-pe style="padding:6px 12px;font-size:13px">Editar</button>'
        :'<div style="flex:1;text-align:left"><b style="color:var(--chord);font-size:18px">'+esc(sel)+'</b><div class="mut">Sem desenho no dicionário.</div></div><button class="btn o" data-pe style="padding:6px 12px;font-size:13px">Adicionar desenho</button>')+'</div>';
    }
    vz.innerHTML='<div class="pal">'+(N.length?N.map(function(n){return '<span class="chip pc'+(sel===n?" on":"")+(vars(n).length?"":" no")+'" data-n="'+esc(n)+'">'+esc(n)+'</span>'}).join(""):'<span class="mut">Crie acordes no Dicionário para arrastar aqui.</span>')
      +'<span class="chip" id="vs" style="color:var(--ink)">✎ Buscar pelo desenho</span>'+pv+'</div><div class="vzb">'+M.map(rowHtml).join("")+'</div>';
  }
  function setMode(v){
    $("#m1").classList.toggle("on",!!v);$("#m2").classList.toggle("on",!v);
    ta.style.display=v?"none":"";vz.style.display=v?"":"none";
    if(v){M=parseM();sel=null;draw()}
  }
  $("#m1").onclick=function(){setMode(1)};$("#m2").onclick=function(){setMode(0)};
  vz.addEventListener("click",function(e){
    var c=e.target.closest(".lc");if(c&&sel)place(+c.dataset.m,+c.dataset.c,sel,null);
  });
  vz.addEventListener("click",function(e){
    var a=e.target.closest("[data-pv]"),p=e.target.closest("[data-pe]"),q2=e.target.closest("#vs");
    if(a&&sel){var V=vars(sel);if(V.length>1){s.pv=s.pv||{};var i=Math.min(s.pv[sel]||0,V.length-1);s.pv[sel]=(i+(+a.dataset.pv)+V.length)%V.length;save();draw()}}
    else if(p&&sel)chordEditor(sel,draw);
    else if(q2)chordEditor(null,draw,true,function(n){if(extra.indexOf(n)<0)extra.push(n);sel=n;draw()});
  });
  vz.addEventListener("pointerdown",function(e){
    var el=e.target.closest(".pc,.pt");if(!el)return;
    var pt=el.classList.contains("pt"),name=pt?el.textContent:el.dataset.n,src=pt?{m:+el.dataset.m,t:+el.dataset.t}:null;
    var x0=e.clientX,y0=e.clientY,drag=false,gh=null,tr=null,hit=null;
    e.preventDefault();
    function over(ev){
      var t=document.elementFromPoint(ev.clientX,ev.clientY),c=t&&t.closest(".lc");
      if(hit&&hit!==c)hit.classList.remove("hit");
      if(c)c.classList.add("hit");hit=c;
      if(tr)tr.classList.toggle("hit",!!(t&&t.closest(".trash")));
    }
    function mv(ev){
      if(!drag&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>7){
        drag=true;gh=document.createElement("div");gh.className="gh2";gh.textContent=name;document.body.appendChild(gh);
        if(src){tr=document.createElement("div");tr.className="trash";tr.textContent="Solte aqui para remover";document.body.appendChild(tr)}
      }
      if(drag){gh.style.left=ev.clientX+"px";gh.style.top=ev.clientY+"px";over(ev)}
    }
    function up(ev){
      document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      var t0=document.elementFromPoint(ev.clientX,ev.clientY),onT=!!(t0&&t0.closest(".trash"));
      if(gh)gh.remove();if(tr)tr.remove();if(hit)hit.classList.remove("hit");
      if(!drag){if(src){if(!el.classList.contains("so"))chordView(name,s,draw,occOf(src.m,src.t,name))}else{sel=sel===name?null:name;draw()}return}
      var c=t0&&t0.closest(".lc");
      if(c)place(+c.dataset.m,+c.dataset.c,name,src);
      else if(src&&onT){M[src.m].c=build(toks(M[src.m].c).filter(function(x){return x.c!==src.t}));commit()}
    }
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
  });
  setMode(ta.value.trim()?1:0);
  $("#sv").onclick=function(){
    var t=$("#t").value.trim();
    if(!t){$("#er").textContent="Digite o nome da música.";return}
    s.title=t;s.artist=$("#a").value.trim();s.text=$("#x").value.replace(/\s+$/,"");
    s.links=$("#l").value.split("\n").map(function(u){return u.trim()}).filter(function(u){return /^https?:\/\//.test(u)});
    if(isNew)S.songs.push(s);
    save();location.hash="s-"+s.id;
  };
  function clean(t){return t.replace(/\s*[\(\[][^\)\]]*[\)\]]\s*/g," ").replace(/\s+(feat|ft|part)\.?\s.*$/i,"").replace(/\s+/g," ").trim()}
  function links(){
    var k=encodeURIComponent((clean($("#t").value)+" "+$("#a").value).trim());
    $("#lc").href="https://www.cifraclub.com.br/?q="+k;
    $("#ll").href="https://www.letras.mus.br/?q="+k;$("#lv").href="https://www.vagalume.com.br/search?q="+k;
  }
  $("#t").addEventListener("input",links);$("#a").addEventListener("input",links);links();
  function getLyrics(ar,t){
    var c=new AbortController(),tm=setTimeout(function(){c.abort()},15000);
    return fetch("https://api.lyrics.ovh/v1/"+encodeURIComponent(ar)+"/"+encodeURIComponent(t),{signal:c.signal})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){
        var l=(j&&j.lyrics||"").replace(/\r\n?/g,"\n").replace(/^Paroles de la chanson[^\n]*\n+/i,"").replace(/\n{3,}/g,"\n\n").trim();
        if(!l)throw 0;return l;
      }).then(function(l){clearTimeout(tm);return l},function(e){clearTimeout(tm);throw e});
  }
  $("#bl").onclick=function(){
    var t=$("#t").value.trim(),ar=$("#a").value.trim(),m=$("#lm"),x=$("#x");
    if(!t||!ar){m.textContent="Preencha a música e o cantor ou grupo para buscar a letra.";return}
    if(x.value.trim()){m.textContent="Já existe texto na letra. Apague-o antes de buscar.";return}
    m.textContent="Buscando letra...";
    var t2=clean(t);
    getLyrics(ar,t).catch(function(){if(t2&&t2!==t)return getLyrics(ar,t2);throw 0})
      .then(function(l){x.value=l;chips();setMode(1);m.textContent="Letra encontrada. Agora coloque as cifras nas linhas acima de cada trecho."})
      .catch(function(){m.textContent="Não achei essa letra. Use o Cifra Club (já tem as cifras) ou Letras/Vagalume para copiar e colar aqui."});
  };
  var d=$("#dl");
  if(d)d.onclick=function(){
    if(!d.dataset.ok){d.dataset.ok=1;d.textContent="Toque de novo para excluir";return}
    S.songs=S.songs.filter(function(x){return x.id!==s.id});save();location.hash="";
  };
}
function viewChords(){
  app.innerHTML='<h1>Dicionário de acordes</h1><input class="search" id="cs" type="search" placeholder="Buscar acorde (ex.: Bb7M)" value="'+esc(cq)+'">'
   +'<div class="row" style="margin-bottom:0"><input id="nn" placeholder="Novo acorde (ex.: Bb7M)" style="flex:1;min-width:0"><button class="btn" id="na">Adicionar</button></div><p id="ne" style="color:#C0392B;min-height:20px;margin:6px 0 0"></p><button class="btn o" id="ds" style="width:100%">✎ Buscar pelo desenho no braço</button><div id="cg"></div>';
  $("#cs").addEventListener("input",function(){cq=this.value;cg()});
  $("#cg").addEventListener("click",function(e){var c=e.target.closest(".cc");if(c)chordEditor(c.dataset.n,cg)});
  $("#na").onclick=function(){
    var n=$("#nn").value.trim();
    if(!CH.test(n)){$("#ne").textContent="Nome de acorde inválido. Exemplos: Am, Bb7M, C#m7, Cm7/9, G/B.";return}
    if(!S.chords[n]){S.chords[n]=[];save()}
    $("#nn").value="";$("#ne").textContent="";cg();chordEditor(n,cg);
  };
  $("#ds").onclick=function(){chordEditor(null,cg,true)};
  cg();
}
/* repertórios */
function repById(id){return (S.reps||[]).filter(function(r){return r.id===id})[0]}
function viewReps(){
  S.reps=S.reps||[];
  if(!cr)try{cr=localStorage.getItem("cavaco-rep")}catch(e){}
  if(!repById(cr))cr=S.reps[0]?S.reps[0].id:null;
  app.innerHTML='<h1>Repertórios</h1><div class="row" style="margin-top:0"><select id="rs" style="flex:1;min-width:0"></select><button class="btn" id="rc">+ Criar repertório</button></div><div id="rp"></div>';
  $("#rs").onchange=function(){cr=this.value;try{localStorage.setItem("cavaco-rep",cr)}catch(e){}repBody()};
  $("#rc").onclick=function(){
    var k=1,N=S.reps.map(function(r){return r.name});while(N.indexOf("Repertório #"+k)>-1)k++;
    var r={id:uid(),name:"Repertório #"+k,songs:[]};S.reps.push(r);cr=r.id;
    try{localStorage.setItem("cavaco-rep",cr)}catch(e){}save();repBody();
    var i=$("#rn");if(i){i.focus();i.select()}
  };
  repBody();
}
function repSel(){
  var s=$("#rs");if(!s)return;
  s.innerHTML=S.reps.length?S.reps.map(function(r){return '<option value="'+r.id+'"'+(r.id===cr?" selected":"")+'>'+esc(r.name)+' ('+r.songs.filter(find).length+')</option>'}).join(""):'<option>Nenhum repertório</option>';
}
function repBody(){
  var box=$("#rp");repSel();
  if(!repById(cr)){box.innerHTML='<div class="empty">Nenhum repertório ainda. Toque em Criar repertório.</div>';return}
  box.innerHTML='<label for="rn">Nome do repertório</label><input id="rn" value="'+esc(repById(cr).name)+'">'
   +'<div class="row"><button class="btn o" id="ra">+ Adicionar músicas</button><button class="btn d" id="rd">Excluir repertório</button></div><div id="rl"></div>';
  $("#rn").onchange=function(){var r=repById(cr),v=this.value.trim();if(!v){this.value=r.name;return}r.name=v;save();repSel()};
  $("#ra").onclick=addSongs;
  $("#rd").onclick=function(){
    var d=this;if(!d.dataset.ok){d.dataset.ok=1;d.textContent="Toque de novo para excluir";return}
    S.reps=S.reps.filter(function(r){return r.id!==cr});cr=null;save();viewReps();
  };
  var L=$("#rl");
  L.addEventListener("click",function(e){var x=e.target.closest("[data-rm]");if(!x)return;var r=repById(cr);r.songs=r.songs.filter(function(i){return i!==x.dataset.rm});save();repSel();repDraw()});
  L.addEventListener("pointerdown",function(e){
    var hd=e.target.closest(".hd");if(!hd)return;e.preventDefault();
    var el=hd.parentNode;el.classList.add("dragging");
    function mv(ev){
      var t=document.elementFromPoint(L.getBoundingClientRect().left+24,ev.clientY),it=t&&t.closest(".ri");
      if(it&&it!==el){var after=el.compareDocumentPosition(it)&Node.DOCUMENT_POSITION_FOLLOWING;L.insertBefore(el,after?it.nextSibling:it);
        [].forEach.call(L.querySelectorAll(".num"),function(n,i){n.textContent=i+1})}
      if(ev.clientY<110)window.scrollBy(0,-14);else if(ev.clientY>window.innerHeight-110)window.scrollBy(0,14);
    }
    function up(){
      document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      var r=repById(cr),o=[].map.call(L.querySelectorAll(".ri"),function(x){return x.dataset.id});
      r.songs=o.concat(r.songs.filter(function(i){return o.indexOf(i)<0}));save();repDraw();
    }
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
  });
  repDraw();
}
function repDraw(){
  var r=repById(cr),L=$("#rl");if(!r||!L)return;
  var A=r.songs.map(find).filter(Boolean);
  L.innerHTML=A.length?A.map(function(s,i){return '<div class="item ri" data-id="'+s.id+'"><span class="hd" aria-label="Arrastar para reordenar">⠿</span><span class="num">'+(i+1)+'</span><a href="#s-'+s.id+'"><b>'+esc(s.title)+'</b><span>'+esc(s.artist||"Sem artista")+'</span></a><button class="st" data-rm="'+s.id+'" aria-label="Remover do repertório">✕</button></div>'}).join(""):'<div class="empty">Repertório vazio. Toque em Adicionar músicas.</div>';
}
function addSongs(){
  var o=sheet(),b=o.firstChild,qq="";b.style.textAlign="left";
  b.innerHTML='<h2>Adicionar músicas</h2><input class="search" id="as" type="search" placeholder="Buscar música ou artista" style="margin:12px 0;text-align:left;font-family:inherit"><div id="al"></div><div class="row" style="justify-content:center;margin-bottom:0"><button class="btn" id="ak">Concluir</button></div>';
  function dr(){
    var r=repById(cr),n=norm(qq.trim()),L=S.songs.filter(function(s){return !n||norm(s.title).indexOf(n)>-1||norm(s.artist||"").indexOf(n)>-1});
    L.sort(function(a,c){return norm(a.title).localeCompare(norm(c.title))});
    b.querySelector("#al").innerHTML=L.length?L.map(function(s){var on=r.songs.indexOf(s.id)>-1;return '<div class="item" style="cursor:pointer" data-id="'+s.id+'"><div style="flex:1;padding:10px 14px"><b style="display:block;font-size:16px">'+esc(s.title)+'</b><span>'+esc(s.artist||"Sem artista")+'</span></div><span class="st'+(on?" on":"")+'" style="font-size:22px;padding:10px 16px">'+(on?"✓":"+")+'</span></div>'}).join(""):'<div class="empty">Nenhuma música encontrada.</div>';
  }
  b.querySelector("#as").addEventListener("input",function(){qq=this.value;dr()});
  b.querySelector("#al").addEventListener("click",function(e){
    var it=e.target.closest(".item");if(!it)return;var r=repById(cr),i=r.songs.indexOf(it.dataset.id);
    if(i>-1)r.songs.splice(i,1);else r.songs.push(it.dataset.id);
    save();dr();repSel();repDraw();
  });
  b.querySelector("#ak").onclick=function(){o.remove()};
  dr();
}
function route(){
  var h=location.hash.slice(1);window.scrollTo(0,0);document.body.classList.remove("mo");
  [].forEach.call(document.querySelectorAll("#dr a"),function(a){a.classList.toggle("on",a.dataset.r===(h==="rep"||h==="acordes"?h:/^(s|e)-|^new$/.test(h)?"":h))});
  if(h==="new")return viewEdit(null);
  if(h==="rep")return viewReps();
  if(h==="acordes")return viewChords();
  var m=/^(s|e)-(\w+)$/.exec(h),s=m&&find(m[2]);
  if(!s)return viewList(false);
  m[1]==="s"?viewSong(s):viewEdit(s);
}
function themeNow(){var t=document.documentElement.dataset.theme;return t||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function themeIcon(){$("#tm").textContent=themeNow()==="dark"?"☀":"☾"}
$("#tm").onclick=function(){var t=themeNow()==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("cavaco-theme",t)}catch(e){}themeIcon()};
themeIcon();
$("#mb").onclick=function(){document.body.classList.add("mo")};
$("#sc").onclick=function(){document.body.classList.remove("mo")};
window.addEventListener("hashchange",route);
loadLocal();route();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();

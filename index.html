<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Cavaco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D5C45">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#EEF2EA;--card:#FBFCF8;--ink:#17261F;--mut:#5D6E64;--acc:#1D5C45;--onacc:#fff;--chord:#A85B00;--line:#D3DCD0;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A16;--card:#1B2620;--ink:#E6EEE7;--mut:#93A59A;--acc:#5FC79C;--onacc:#0B1510;--chord:#F0B24A;--line:#2B3A31;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:4px 16px 100px}
header#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:6px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
.brand{flex:1;font-weight:800;font-size:19px;letter-spacing:-.01em}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:26px;padding:0}
#cl{position:relative}
.av{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0;overflow:hidden;background:var(--acc);color:var(--onacc);font:700 16px inherit;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pop{position:absolute;right:0;top:48px;width:230px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:14px;word-break:break-all}
#sc{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#dr{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:84vw;background:var(--card);z-index:31;transform:translateX(-100%);transition:transform .22s;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px}
body.mo #sc{opacity:1;pointer-events:auto}body.mo #dr{transform:none}
#dr .t{font-weight:800;font-size:22px;padding:4px 14px 16px}
#dr a{display:block;padding:14px;margin-bottom:4px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:17px}
#dr a.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
h1{font-size:28px;font-weight:800;margin:10px 0 14px;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.search{width:100%;padding:14px 18px;border-radius:26px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px}
input,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.search:focus,input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.letter{font-weight:800;color:var(--acc);font-size:14px;margin:18px 4px 2px}
.item{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0}
.item a{flex:1;min-width:0;padding:12px 16px;text-decoration:none;color:inherit}
.item b{display:block;font-size:17px;font-weight:600}
.item span,.mut{color:var(--mut);font-size:14px}
.st{border:0;background:none;font-size:24px;line-height:1;color:var(--mut);padding:10px 14px;cursor:pointer}.st.on{color:var(--chord)}
.empty{color:var(--mut);padding:32px 4px;text-align:center}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);border:0;border-radius:30px;padding:16px 22px;font:600 17px "Bricolage Grotesque",sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:14px;padding:12px 18px;font:600 16px "Bricolage Grotesque",sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.d{background:transparent;color:#C0392B;border:1.5px solid #C0392B}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.back{color:var(--acc);text-decoration:none;font-weight:600}
.cifra{font:500 14.5px/1.35 "DM Mono",ui-monospace,monospace;white-space:pre;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.cifra .cl{color:var(--chord);font-weight:500}
.cifra .c{cursor:pointer;border-bottom:1.5px dotted var(--chord)}
.cifra .c.k{background:color-mix(in srgb,var(--chord) 18%,transparent);border-radius:4px}
label{display:block;font-weight:600;margin:16px 0 6px}
textarea.cf{font:500 14px/1.35 "DM Mono",ui-monospace,monospace;white-space:pre;min-height:300px}
.yt{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin:8px 0;color:inherit;text-decoration:none;background:var(--card);overflow:hidden;white-space:nowrap}
.chip{display:inline-block;margin:6px 6px 0 0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--chord);font:500 14px "DM Mono",monospace;cursor:pointer}
.chip.no{opacity:.65;border-style:dashed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer}
.cc b{display:block;font-size:18px;color:var(--chord)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
.sh input{text-align:center;font-size:18px;font-family:"DM Mono",monospace}
.dg{display:block;margin:6px auto;height:auto}
.dg *{stroke:var(--ink)}.dg .dot{fill:var(--ink);stroke:none}
.dg text{fill:var(--ink);stroke:none;font:600 14px "Bricolage Grotesque",sans-serif}
.fbw{display:flex;gap:12px;justify-content:center;align-items:flex-start;color:var(--mut)}
.mm{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:24px}
.mm .ib{width:34px;height:34px;font-size:14px;border:1px solid var(--line);color:var(--ink)}
.mp{position:relative;width:34px;height:210px;border-radius:8px;border:1px solid var(--line);background:repeating-linear-gradient(var(--card) 0 11px,var(--line) 11px 12px);touch-action:none;cursor:pointer}
.vp{position:absolute;left:-1px;right:-1px;border:2px solid var(--acc);border-radius:6px;background:color-mix(in srgb,var(--acc) 18%,transparent);pointer-events:none}
.fsc{width:250px;height:250px;overflow-y:auto;overflow-x:hidden;border-radius:10px;background:var(--bg)}
.fsc svg{display:block}.cell{cursor:pointer}.cell .gh{fill:var(--acc);opacity:0}.cell:hover .gh{opacity:.35}
.fh,.ff{display:grid;grid-template-columns:repeat(4,50px);margin-left:25px;width:200px;text-align:center}
.fh span{font-weight:800;padding:2px 0 4px;color:var(--ink)}
.fb{width:38px;height:38px;margin:6px auto 0;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 17px "Bricolage Grotesque",sans-serif;cursor:pointer;padding:0}
.fb.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.dg .fn{fill:var(--card)}
</style>
</head>
<body>
<header id="top"><button class="ib" id="mb" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="brand">Meu Cavaco</span><div id="cl"></div></header>
<div id="sc"></div>
<nav id="dr"><div class="t">Meu Cavaco</div><a href="#" data-r="">♪ Músicas</a><a href="#fav" data-r="fav">★ Favoritas</a><a href="#acordes" data-r="acordes">🎸 Dicionário de acordes</a></nav>
<main id="app"></main>
<script>
(function(){
var S={songs:[],chords:{}},q="",cq="",fav=false;
var $=function(s){return document.querySelector(s)};
var app=$("#app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function uid(){return Math.random().toString(36).slice(2,8)}
function loadLocal(){try{var j=localStorage.getItem("cavaco");if(j)S=JSON.parse(j)}catch(e){}}
function save(){
  try{localStorage.setItem("cavaco",JSON.stringify(S))}catch(e){}
  try{if(window.cavaco.onSave)window.cavaco.onSave(S)}catch(e){}
}
function cg(){
  var n=norm(cq.trim()),N=Object.keys(S.chords).filter(function(k){return !n||norm(k).indexOf(n)>-1}).sort(function(a,b){return a.localeCompare(b)});
  $("#cg").innerHTML=N.length?'<div class="grid">'+N.map(function(k){var V=vars(k);return '<div class="cc" data-n="'+esc(k)+'"><b>'+esc(k)+'</b>'+(V.length?dg(V[0],64):'<p class="mut">sem desenho</p>')+'<span class="mut">'+V.length+(V.length===1?' variação':' variações')+'</span></div>'}).join("")+'</div>':'<div class="empty">'+(Object.keys(S.chords).length?"Nenhum acorde encontrado.":"O dicionário está vazio. Adicione um acorde acima.")+'</div>';
}
window.cavaco={onSave:null,paint:null,
  state:function(){return S},
  commit:function(){
    try{localStorage.setItem("cavaco",JSON.stringify(S))}catch(e){}
    var h=location.hash;
    if($("#res"))res();else if($("#cg"))cg();
    else if(/^#s-/.test(h)){var y=window.scrollY;route();window.scrollTo(0,y)}
  }};

var CH=/^[A-G][#b]?(maj|min|dim|aug|sus|add|m|M|º|°|\+)?[0-9]*(M|maj|m|sus[24]?|add[0-9]+|dim|aug|[#b][0-9]+|\([^)]*\))*(\/[A-G][#b]?)?$/;
function isChordLine(l){var t=l.trim().split(/\s+/);return l.trim()!==""&&t.every(function(x){return CH.test(x)})}
function vars(n){var v=S.chords[n];return !v?[]:Array.isArray(v)?v:[v]}
function chordNames(txt){var o=[];txt.split("\n").forEach(function(l){if(isChordLine(l))l.trim().split(/\s+/).forEach(function(c){if(o.indexOf(c)<0)o.push(c)})});return o}
function renderCifra(txt){
  return txt.split("\n").map(function(l){
    if(isChordLine(l))return '<span class="cl">'+l.replace(/\S+/g,function(m){return '<span class="c'+(vars(m).length?" k":"")+'" data-c="'+esc(m)+'">'+esc(m)+'</span>'})+'</span>';
    return esc(l);
  }).join("\n");
}
function parseFrets(s){
  var t=String(s).trim().split(/[\s,\-]+/);if(t.length<4||t.length>6)return null;
  var r=[],i,m;for(i=0;i<4;i++){if(/^x$/i.test(t[i]))r.push(-1);else if(/^\d{1,2}$/.test(t[i]))r.push(+t[i]);else return null}
  for(i=4;i<t.length;i++){if(m=/^b(\d{1,2})$/.exec(t[i]))r.bar=+m[1];else if(m=/^f([0-4]{4})$/.exec(t[i]))r.fing=m[1];else return null}
  return r;
}
function diagram(f,nums){
  var pos=f.filter(function(x){return x>0}),mx=Math.max.apply(null,pos.concat([0])),mn=Math.min.apply(null,pos.concat([99]));
  var base=mx>5?mn:1,X=[30,63,96,129],g="",cy=function(v){return 40+(v-base+.5)*30};
  for(var i=0;i<4;i++)g+='<line x1="'+X[i]+'" y1="40" x2="'+X[i]+'" y2="190" stroke-width="2"/>';
  for(var r=0;r<=5;r++)g+='<line x1="30" y1="'+(40+r*30)+'" x2="129" y2="'+(40+r*30)+'" stroke-width="'+(r===0&&base===1?5:1.2)+'"/>';
  if(f.bar){var bs=[0,1,2,3].filter(function(i){return f[i]===f.bar});if(bs.length>1)g+='<rect class="dot" x="'+(X[bs[0]]-11)+'" y="'+(cy(f.bar)-11)+'" width="'+(X[bs[bs.length-1]]-X[bs[0]]+22)+'" height="22" rx="11"/>'}
  f.forEach(function(v,i){
    if(v===-1)g+='<text x="'+X[i]+'" y="30" text-anchor="middle">×</text>';
    else if(v===0)g+='<circle cx="'+X[i]+'" cy="24" r="6" fill="none" stroke-width="2"/>';
    else{g+='<circle class="dot" cx="'+X[i]+'" cy="'+cy(v)+'" r="11"/>';
      if(nums&&f.fing&&f.fing[i]!=="0")g+='<text class="fn" x="'+X[i]+'" y="'+(cy(v)+5)+'" text-anchor="middle">'+f.fing[i]+'</text>'}
  });
  if(base>1)g+='<text x="14" y="62" text-anchor="middle">'+base+'ª</text>';
  return '<svg viewBox="0 0 160 200">'+g+'</svg>';
}
function dg(str,w){var f=parseFrets(str);return f?diagram(f,(w||90)>=100).replace("<svg ",'<svg class="dg" style="width:'+(w||90)+'px" '):""}
function sheet(){var o=document.createElement("div");o.className="ov";o.innerHTML='<div class="sh"></div>';document.body.appendChild(o);o.addEventListener("click",function(e){if(e.target===o)o.remove()});return o}

/* editor interativo de variações de um acorde (braço do cavaquinho: ré sol si ré) */
var FH=46,NF=17,SX=[50,100,150,200];
function chordEditor(n,done){
  var o=sheet(),b=o.firstChild,ed=-1,st=blank();
  function blank(){return {f:[-1,-1,-1,-1],ord:[],bar:0}}
  function fromStr(x){var p=parseFrets(x),s=blank();if(!p)return s;s.f=p.slice(0,4);
    var fi=p.fing?p.fing.split("").map(Number):null,ix=[0,1,2,3].filter(function(i){return s.f[i]>0});
    s.ord=fi&&fi.some(Boolean)?ix.filter(function(i){return fi[i]>0}).sort(function(a,c){return fi[a]-fi[c]}):ix;s.bar=p.bar||0;return s}
  function toStr(){var fg=st.f.map(function(v,i){var k=st.ord.indexOf(i);return v>0&&k>=0?k+1:0}).join("");
    return st.f.map(function(v){return v<0?"x":v}).join(" ")+(st.bar?" b"+st.bar:"")+(fg!=="0000"?" f"+fg:"")}
  function barFrets(){var c={};st.f.forEach(function(v){if(v>0)c[v]=(c[v]||0)+1});return Object.keys(c).filter(function(k){return c[k]>1}).map(Number)}
  b.innerHTML='<h2>'+esc(n)+'</h2><div id="vl"></div><p class="mut" id="et" style="margin:14px 0 8px"></p>'
   +'<div class="fbw"><div class="mm"><button class="ib" id="up">▲</button><div class="mp" id="mp"><div class="vp" id="vp"></div></div><button class="ib" id="dn">▼</button></div>'
   +'<div><div class="fh"><span>D</span><span>G</span><span>B</span><span>D</span></div><div class="fsc" id="sc"><svg id="bd" width="250" height="'+(NF*FH+20)+'" viewBox="0 0 250 '+(NF*FH+20)+'"></svg></div><div class="ff" id="ff"></div></div></div>'
   +'<div id="bb"></div><p id="er" style="color:#C0392B;min-height:20px;margin:6px 0"></p><div class="row" style="justify-content:center;margin:0"><button class="btn" id="ad"></button><button class="btn o" id="nw">Limpar</button><button class="btn o" id="ok">Concluir</button></div>';
  var sc=b.querySelector("#sc"),mp=b.querySelector("#mp"),vp=b.querySelector("#vp"),bd=b.querySelector("#bd");
  function list(){
    var V=vars(n);
    b.querySelector("#vl").innerHTML=V.length?'<div class="grid" style="margin:10px 0">'+V.map(function(v,i){return '<div class="cc" style="cursor:default'+(i===ed?';border-color:var(--acc)':'')+'">'+dg(v,70)+'<div style="margin-top:6px"><button class="btn o" data-e="'+i+'" style="padding:4px 10px;font-size:13px">Editar</button> <button class="btn d" data-d="'+i+'" style="padding:4px 10px;font-size:13px">Excluir</button></div></div>'}).join("")+'</div>':'<p class="mut">Nenhuma variação ainda.</p>';
    [].forEach.call(b.querySelectorAll("[data-e]"),function(x){x.onclick=function(){ed=+x.dataset.e;st=fromStr(vars(n)[ed]);paint();list();var m=Math.min.apply(null,st.f.filter(function(v){return v>0}).concat([1]));sc.scrollTop=(m-1)*FH}});
    [].forEach.call(b.querySelectorAll("[data-d]"),function(x){x.onclick=function(){var L=vars(n).slice(),i=+x.dataset.d;L.splice(i,1);S.chords[n]=L;if(ed===i){ed=-1;st=blank()}else if(ed>i)ed--;save();list();paint()}});
  }
  function paint(){
    var g="",i,r,cy=function(r){return (r-.5)*FH+10};
    [5,7,10,12,15,17].forEach(function(r){g+='<circle cx="125" cy="'+cy(r)+'" r="8" fill="currentColor" opacity=".13"/>'});
    for(r=0;r<=NF;r++)g+='<line x1="25" x2="225" y1="'+(10+r*FH)+'" y2="'+(10+r*FH)+'" stroke="currentColor" stroke-width="'+(r?1.5:6)+'" opacity="'+(r?.45:.8)+'"/>';
    for(i=0;i<4;i++)g+='<line y1="10" y2="'+(10+NF*FH)+'" x1="'+SX[i]+'" x2="'+SX[i]+'" stroke="currentColor" stroke-width="2.5" opacity=".75"/>';
    for(r=1;r<=NF;r++)g+='<text x="10" y="'+(cy(r)+5)+'" font-size="15" text-anchor="middle" fill="currentColor" opacity=".8">'+r+'</text>';
    if(st.bar){var bs=[0,1,2,3].filter(function(i){return st.f[i]===st.bar});if(bs.length>1)g+='<rect x="'+(SX[bs[0]]-16)+'" y="'+(cy(st.bar)-16)+'" width="'+(SX[bs[bs.length-1]]-SX[bs[0]]+32)+'" height="32" rx="16" fill="var(--acc)"/>'}
    st.f.forEach(function(v,i){if(v>0)g+='<circle cx="'+SX[i]+'" cy="'+cy(v)+'" r="16" fill="var(--acc)"/><text x="'+SX[i]+'" y="'+(cy(v)+6)+'" font-size="17" font-weight="700" text-anchor="middle" fill="var(--onacc)">'+(st.ord.indexOf(i)+1)+'</text>'});
    for(r=1;r<=NF;r++)for(i=0;i<4;i++)g+='<g class="cell" data-s="'+i+'" data-f="'+r+'"><rect x="'+(SX[i]-25)+'" y="'+(10+(r-1)*FH)+'" width="50" height="'+FH+'" fill="transparent"/><circle class="gh" cx="'+SX[i]+'" cy="'+cy(r)+'" r="16"/></g>';
    bd.innerHTML=g;
    b.querySelector("#ff").innerHTML=st.f.map(function(v,i){return '<button class="fb'+(v>0?" on":"")+'" data-t="'+i+'" aria-label="Corda">'+(v<0?"×":v===0?"○":v)+'</button>'}).join("");
    var bf=barFrets();if(st.bar&&bf.indexOf(st.bar)<0)st.bar=0;
    b.querySelector("#bb").innerHTML=bf.length?'<div style="margin-top:8px">'+bf.map(function(k){return '<span class="chip'+(st.bar===k?" on":"")+'" data-b="'+k+'">Pestana na casa '+k+'</span>'}).join("")+'</div>':'';
    b.querySelector("#ad").textContent=ed>=0?"Salvar alterações":"Adicionar";
    b.querySelector("#et").textContent=ed>=0?"Editando a variação "+(ed+1):"Nova variação: toque nas casas (1 a 4 na ordem) e use × / ○ embaixo para corda muda ou solta";
    vpu();
  }
  function vpu(){var t=sc.scrollHeight||1,h=mp.clientHeight;vp.style.top=(sc.scrollTop/t*h)+"px";vp.style.height=Math.max(10,sc.clientHeight/t*h)+"px"}
  sc.addEventListener("scroll",vpu);
  function jump(e){var r=mp.getBoundingClientRect();sc.scrollTop=(e.clientY-r.top)/r.height*sc.scrollHeight-sc.clientHeight/2}
  mp.addEventListener("pointerdown",function(e){mp.setPointerCapture(e.pointerId);jump(e)});
  mp.addEventListener("pointermove",function(e){if(e.buttons)jump(e)});
  b.querySelector("#up").onclick=function(){sc.scrollBy({top:-2*FH,behavior:"smooth"})};
  b.querySelector("#dn").onclick=function(){sc.scrollBy({top:2*FH,behavior:"smooth"})};
  bd.addEventListener("click",function(e){
    var c=e.target.closest(".cell");if(!c)return;
    var s=+c.dataset.s,r=+c.dataset.f;
    if(st.f[s]===r){st.f[s]=-1;st.ord=st.ord.filter(function(x){return x!==s})}
    else{if(st.f[s]<=0)st.ord.push(s);st.f[s]=r}
    paint();
  });
  b.querySelector("#ff").addEventListener("click",function(e){
    var t=e.target.closest("[data-t]");if(!t)return;var i=+t.dataset.t;
    if(st.f[i]>0){st.f[i]=-1;st.ord=st.ord.filter(function(x){return x!==i})}else st.f[i]=st.f[i]<0?0:-1;
    paint();
  });
  b.querySelector("#bb").addEventListener("click",function(e){var c=e.target.closest("[data-b]");if(c){st.bar=st.bar===+c.dataset.b?0:+c.dataset.b;paint()}});
  b.querySelector("#nw").onclick=function(){ed=-1;st=blank();b.querySelector("#er").textContent="";paint();list()};
  b.querySelector("#ok").onclick=function(){o.remove();if(done)done()};
  b.querySelector("#ad").onclick=function(){
    if(st.f.every(function(v){return v<0})){b.querySelector("#er").textContent="Marque ao menos uma corda (toque em × para soltar ou numa casa).";return}
    var x=toStr(),L=vars(n).slice();
    if(ed>=0)L[ed]=x;else if(L.indexOf(x)<0)L.push(x);
    S.chords[n]=L;save();ed=-1;st=blank();b.querySelector("#er").textContent="";list();paint();
  };
  list();paint();
}
/* visualizar/escolher a variação de um acorde dentro de uma música */
function chordView(n,s,cb){
  var o=sheet(),b=o.firstChild;
  function draw(){
    var V=vars(n);s.pv=s.pv||{};var i=Math.min(s.pv[n]||0,Math.max(V.length-1,0)),m=V.length>1;
    b.innerHTML='<h2>'+esc(n)+'</h2>'+(V.length?'<div style="display:flex;align-items:center;justify-content:center;gap:6px">'+(m?'<button class="ib" id="pr">‹</button>':'')+dg(V[i],170)+(m?'<button class="ib" id="nx">›</button>':'')+'</div><p class="mut">Variação '+(i+1)+' de '+V.length+(m?' · a escolha fica salva nesta música':'')+'</p>':'<p class="mut">Este acorde ainda não tem desenho no dicionário.</p>')
     +'<div class="row" style="justify-content:center;margin:8px 0 0"><button class="btn" id="ed">'+(V.length?'Gerenciar variações':'Adicionar desenho')+'</button><button class="btn o" id="cx">Fechar</button></div>';
    b.querySelector("#cx").onclick=function(){o.remove();if(cb)cb()};
    b.querySelector("#ed").onclick=function(){o.remove();chordEditor(n,function(){chordView(n,s,cb)})};
    if(m){
      b.querySelector("#pr").onclick=function(){s.pv[n]=(i-1+V.length)%V.length;save();draw()};
      b.querySelector("#nx").onclick=function(){s.pv[n]=(i+1)%V.length;save();draw()};
    }
  }
  draw();
}

/* telas */
function viewList(f){
  fav=f;
  app.innerHTML='<h1>'+(f?"Favoritas":"Músicas")+'</h1><input class="search" id="q" type="search" placeholder="Buscar música, cantor ou grupo" value="'+esc(q)+'"><div id="res"></div>'+(f?'':'<a class="fab" href="#new">+ Nova música</a>');
  var qi=$("#q");qi.addEventListener("input",function(){q=qi.value;res()});
  $("#res").addEventListener("click",function(e){
    var b=e.target.closest(".st");if(!b)return;
    var s=find(b.dataset.id);if(s){s.fav=!s.fav;save();res()}
  });
  res();
}
function res(){
  var n=norm(q.trim()),L=S.songs.filter(function(s){return (!fav||s.fav)&&(!n||norm(s.title).indexOf(n)>-1||norm(s.artist||"").indexOf(n)>-1)});
  L.sort(function(a,b){return norm(a.title).localeCompare(norm(b.title))});
  var h="",last="";
  L.forEach(function(s){
    var l=norm(s.title).charAt(0).toUpperCase();if(!/[A-Z]/.test(l))l="#";
    if(l!==last){h+='<div class="letter">'+l+'</div>';last=l}
    h+='<div class="item"><a href="#s-'+s.id+'"><b>'+esc(s.title)+'</b><span>'+esc(s.artist||"Sem artista")+'</span></a><button class="st'+(s.fav?" on":"")+'" data-id="'+s.id+'" aria-label="Favoritar">'+(s.fav?"★":"☆")+'</button></div>';
  });
  if(!h)h='<div class="empty">'+(fav&&!n?"Nenhuma favorita ainda. Toque na estrela de uma música.":S.songs.length?"Nada encontrado para essa busca.":"Sua lista está vazia. Toque em Nova música para começar.")+'</div>';
  $("#res").innerHTML=h;
}
function find(id){return S.songs.filter(function(s){return s.id===id})[0]}
function viewSong(s){
  var vids=(s.links||[]).map(function(u,i){return '<a class="yt" href="'+esc(u)+'" target="_blank" rel="noopener">▶ Vídeo '+(i+1)+' <span class="mut">'+esc(u.replace(/^https?:\/\/(www\.)?/,""))+'</span></a>'}).join("");
  app.innerHTML='<a class="back" href="#">‹ Todas as músicas</a><div style="display:flex;align-items:center"><h1 style="margin:8px 0 2px;flex:1">'+esc(s.title)+'</h1><button class="st'+(s.fav?" on":"")+'" id="fv" aria-label="Favoritar">'+(s.fav?"★":"☆")+'</button></div><div class="mut">'+esc(s.artist||"")+'</div>'
   +'<div class="mut" style="margin-top:10px">Toque em uma cifra para ver o desenho no cavaquinho.</div>'
   +'<div class="cifra" id="cf">'+renderCifra(s.text||"")+'</div>'
   +(vids?'<h2 style="font-size:18px;margin-top:20px">Vídeos</h2>'+vids:'')
   +'<div class="row"><a class="btn o" href="#e-'+s.id+'">Editar</a></div>';
  $("#cf").addEventListener("click",function(e){var c=e.target.closest(".c");if(c)chordView(c.dataset.c,s,function(){route()})});
  $("#fv").onclick=function(){s.fav=!s.fav;save();this.textContent=s.fav?"★":"☆";this.classList.toggle("on",!!s.fav)};
}
function viewEdit(s){
  var isNew=!s;s=s||{id:uid(),title:"",artist:"",text:"",links:[],pv:{}};
  app.innerHTML='<a class="back" href="'+(isNew?'#':'#s-'+s.id)+'">‹ Voltar</a><h1>'+(isNew?"Nova música":"Editar música")+'</h1>'
   +'<label for="t">Música</label><input id="t" value="'+esc(s.title)+'">'
   +'<label for="a">Cantor ou grupo</label><input id="a" value="'+esc(s.artist||"")+'">'
   +'<label for="x">Letra com cifras</label><div class="mut" style="margin-bottom:6px">Escreva a linha das cifras acima da linha da letra, como no Cifra Club.</div>'
   +'<div class="row" style="margin:6px 0"><button class="btn o" id="bl">Buscar letra</button><a class="btn o" id="lc" target="_blank" rel="noopener">Cifra Club</a><a class="btn o" id="ll" target="_blank" rel="noopener">Letras.mus.br</a><a class="btn o" id="lv" target="_blank" rel="noopener">Vagalume</a></div><p id="lm" class="mut" style="margin:0 0 6px"></p>'
   +'<textarea class="cf" id="x" spellcheck="false" placeholder="G        D\nLetra da música aqui">'+esc(s.text||"")+'</textarea>'
   +'<label>Acordes desta música</label><div class="mut">Toque em um acorde para escolher a variação do dicionário.</div><div id="ch"></div>'
   +'<label for="l">Links do YouTube (um por linha)</label><textarea id="l" rows="3" placeholder="https://youtu.be/...">'+esc((s.links||[]).join("\n"))+'</textarea>'
   +'<p id="er" style="color:#C0392B;min-height:20px"></p>'
   +'<div class="row"><button class="btn" id="sv">Salvar</button>'+(isNew?'':'<button class="btn d" id="dl">Excluir</button>')+'</div>';
  function chips(){
    var N=chordNames($("#x").value);
    $("#ch").innerHTML=N.length?N.map(function(c){return '<span class="chip'+(vars(c).length?"":" no")+'" data-c="'+esc(c)+'">'+esc(c)+'</span>'}).join(""):'<div class="mut" style="margin-top:6px">Nenhum acorde reconhecido ainda.</div>';
  }
  $("#ch").addEventListener("click",function(e){var c=e.target.closest(".chip");if(c)chordView(c.dataset.c,s,chips)});
  $("#x").addEventListener("input",chips);chips();
  $("#sv").onclick=function(){
    var t=$("#t").value.trim();
    if(!t){$("#er").textContent="Digite o nome da música.";return}
    s.title=t;s.artist=$("#a").value.trim();s.text=$("#x").value.replace(/\s+$/,"");
    s.links=$("#l").value.split("\n").map(function(u){return u.trim()}).filter(function(u){return /^https?:\/\//.test(u)});
    if(isNew)S.songs.push(s);
    save();location.hash="s-"+s.id;
  };
  function clean(t){return t.replace(/\s*[\(\[][^\)\]]*[\)\]]\s*/g," ").replace(/\s+(feat|ft|part)\.?\s.*$/i,"").replace(/\s+/g," ").trim()}
  function links(){
    var k=encodeURIComponent((clean($("#t").value)+" "+$("#a").value).trim());
    $("#lc").href="https://www.cifraclub.com.br/?q="+k;
    $("#ll").href="https://www.letras.mus.br/?q="+k;$("#lv").href="https://www.vagalume.com.br/search?q="+k;
  }
  $("#t").addEventListener("input",links);$("#a").addEventListener("input",links);links();
  function getLyrics(ar,t){
    var c=new AbortController(),tm=setTimeout(function(){c.abort()},15000);
    return fetch("https://api.lyrics.ovh/v1/"+encodeURIComponent(ar)+"/"+encodeURIComponent(t),{signal:c.signal})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){
        var l=(j&&j.lyrics||"").replace(/\r\n?/g,"\n").replace(/^Paroles de la chanson[^\n]*\n+/i,"").replace(/\n{3,}/g,"\n\n").trim();
        if(!l)throw 0;return l;
      }).then(function(l){clearTimeout(tm);return l},function(e){clearTimeout(tm);throw e});
  }
  $("#bl").onclick=function(){
    var t=$("#t").value.trim(),ar=$("#a").value.trim(),m=$("#lm"),x=$("#x");
    if(!t||!ar){m.textContent="Preencha a música e o cantor ou grupo para buscar a letra.";return}
    if(x.value.trim()){m.textContent="Já existe texto na letra. Apague-o antes de buscar.";return}
    m.textContent="Buscando letra...";
    var t2=clean(t);
    getLyrics(ar,t).catch(function(){if(t2&&t2!==t)return getLyrics(ar,t2);throw 0})
      .then(function(l){x.value=l;chips();m.textContent="Letra encontrada. Agora coloque as cifras nas linhas acima de cada trecho."})
      .catch(function(){m.textContent="Não achei essa letra. Use o Cifra Club (já tem as cifras) ou Letras/Vagalume para copiar e colar aqui."});
  };
  var d=$("#dl");
  if(d)d.onclick=function(){
    if(!d.dataset.ok){d.dataset.ok=1;d.textContent="Toque de novo para excluir";return}
    S.songs=S.songs.filter(function(x){return x.id!==s.id});save();location.hash="";
  };
}
function viewChords(){
  app.innerHTML='<h1>Dicionário de acordes</h1><input class="search" id="cs" type="search" placeholder="Buscar acorde (ex.: Bb7M)" value="'+esc(cq)+'">'
   +'<div class="row" style="margin-bottom:0"><input id="nn" placeholder="Novo acorde (ex.: Bb7M)" style="flex:1;min-width:0"><button class="btn" id="na">Adicionar</button></div><p id="ne" style="color:#C0392B;min-height:20px;margin:6px 0 0"></p><div id="cg"></div>';
  $("#cs").addEventListener("input",function(){cq=this.value;cg()});
  $("#cg").addEventListener("click",function(e){var c=e.target.closest(".cc");if(c)chordEditor(c.dataset.n,cg)});
  $("#na").onclick=function(){
    var n=$("#nn").value.trim();
    if(!CH.test(n)){$("#ne").textContent="Nome de acorde inválido. Exemplos: Am, Bb7M, C#m7, G/B.";return}
    if(!S.chords[n]){S.chords[n]=[];save()}
    $("#nn").value="";$("#ne").textContent="";cg();chordEditor(n,cg);
  };
  cg();
}
function route(){
  var h=location.hash.slice(1);window.scrollTo(0,0);document.body.classList.remove("mo");
  [].forEach.call(document.querySelectorAll("#dr a"),function(a){a.classList.toggle("on",a.dataset.r===(h==="fav"||h==="acordes"?h:/^(s|e)-|^new$/.test(h)?"":h))});
  if(h==="new")return viewEdit(null);
  if(h==="fav")return viewList(true);
  if(h==="acordes")return viewChords();
  var m=/^(s|e)-(\w+)$/.exec(h),s=m&&find(m[2]);
  if(!s)return viewList(false);
  m[1]==="s"?viewSong(s):viewEdit(s);
}
